<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property — Easy Homes Kenya</title>
  <meta name="description" content="Property details and contact information. Find price, location and images for this listing.">
  <link rel="canonical" href="https://easyhomeskenya.online/property.html">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Property — Easy Homes Kenya">
  <meta property="og:description" content="See details of this property including price, images and location.">
  <meta property="og:url" content="https://easyhomeskenya.online/property.html">
  <meta property="og:image" content="https://easyhomeskenya.online/images/og-image.jpg">

  <link rel="stylesheet" href="style.css">

  <!-- Placeholder structured data for a single property (will be updated dynamically if you populate data) -->
  <script type="application/ld+json" id="property-ld">
  {
    "@context": "https://schema.org",
    "@type": "Residence",
    "name": "Sample Property",
    "description": "Property details and overview.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Nairobi",
      "addressCountry": "KE"
    },
    "image": [
      "https://easyhomeskenya.online/images/listing-placeholder.jpg"
    ],
    "offers": {
      "@type": "Offer",
      "priceCurrency": "KES",
      "price": "Contact"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Homepage">
        <img src="/images/logo.png" alt="Easy Homes Kenya logo" width="160" height="40">
      </a>
    </div>
  </header>

  <main id="main-content" class="container">
    <div id="property" class="property-detail">
      <!-- Property content populated by JavaScript from listings.json using ?id=... -->
      <p>Loading property details…</p>
    </div>
  </main>

  <footer class="site-footer container">
    <p>&copy; <span id="year"></span> Easy Homes Kenya.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function getQueryParam(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }

    async function showProperty() {
      const id = getQueryParam('id');
      try {
        const res = await fetch('listings.json', {cache: "no-cache"});
        const listings = await res.json();
        const item = listings.find(l => String(l.id) === String(id)) || listings[0];

        if (!item) {
          document.getElementById('property').innerHTML = '<p>Property not found.</p>';
          return;
        }

        // Update HTML
        const title = item.title || 'Property';
        const city = item.city || item.location || '';
        const price = item.price ? (item.price_label || item.price) : 'Contact for price';
        const img = item.image || 'images/listing-placeholder.jpg';
        const imgSmall = img.replace(/(\.[a-zA-Z]+)$/, '-small$1');
        const imgMed = img.replace(/(\.[a-zA-Z]+)$/, '-med$1');
        const imgLarge = img.replace(/(\.[a-zA-Z]+)$/, '-large$1');

        document.title = `${title} — Easy Homes Kenya`;

        document.getElementById('property').innerHTML = `
          <article>
            <h1>${title}</h1>
            <p class="muted">${city}</p>
            <div class="property-media">
              <img
                src="${imgSmall}"
                srcset="${imgSmall} 400w, ${imgMed} 800w, ${imgLarge} 1200w"
                sizes="(max-width: 600px) 100vw, 60vw"
                alt="${item.alt || title + (city ? ' — ' + city : '')}"
                loading="lazy"
                width="800" height="500"
                onerror="this.onerror=null;this.src='images/listing-placeholder.jpg';">
            </div>
            <p class="price">${price}</p>
            <p>${item.description || 'No description provided.'}</p>
            <p><strong>Contact:</strong> ${item.contact || 'Contact us for details'}</p>
          </article>
        `;

        // Update JSON-LD with real data
        const ld = {
          "@context": "https://schema.org",
          "@type": "Residence",
          "name": title,
          "description": item.description || '',
          "image": [img],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": city,
            "addressCountry": "KE"
          },
          "offers": {
            "@type": "Offer",
            "priceCurrency": "KES",
            "price": item.price || 'Contact'
          }
        };
        document.getElementById('property-ld').textContent = JSON.stringify(ld);
      } catch (err) {
        document.getElementById('property').innerHTML = '<p>Unable to load property details.</p>';
        console.error(err);
      }
    }

    showProperty();
  </script>
</body>
</html>
