<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Dream Home in Kenya — Easy Homes Kenya</title>
  <meta name="description" content="Browse homes and apartments for sale and rent across Kenya. Filter by location, price and property type to find your dream home.">
  <link rel="canonical" href="https://easyhomeskenya.online/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Find Your Dream Home in Kenya">
  <meta property="og:description" content="Browse homes and apartments for sale and rent across Kenya.">
  <meta property="og:url" content="https://easyhomeskenya.online/">
  <meta property="og:image" content="https://easyhomeskenya.online/images/og-image.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Find Your Dream Home in Kenya">
  <meta name="twitter:description" content="Browse homes and apartments for sale and rent across Kenya.">
  <meta name="twitter:image" content="https://easyhomeskenya.online/images/og-image.jpg">

  <link rel="icon" href="/images/favicon.ico">

  <!-- Structured data for the site / agent -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "RealEstateAgent",
    "name": "Easy Homes Kenya",
    "url": "https://easyhomeskenya.online/",
    "logo": "https://easyhomeskenya.online/images/logo.png",
    "areaServed": "KE",
    "sameAs": [
      "https://www.facebook.com/yourpage",
      "https://twitter.com/yourhandle"
    ]
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Homepage - Find Your Dream Home in Kenya">
        <img src="/images/logo.png" alt="Easy Homes Kenya logo" width="160" height="40">
      </a>
      <nav class="main-nav" role="navigation" aria-label="Main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="#listings">Listings</a></li>
          <li><a href="/property.html">Example Property</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container">
    <h1>Properties for sale and rent in Kenya</h1>

    <section id="search">
      <form id="search-form" role="search" aria-label="Search properties">
        <label for="q" class="visually-hidden">Search</label>
        <input id="q" name="q" type="search" placeholder="Search by city, location or keyword" />
        <button type="submit">Search</button>
      </form>
    </section>

    <section id="listings" class="listings" aria-live="polite" aria-label="Property listings">
      <!-- Listings rendered by JavaScript -->
    </section>
  </main>

  <footer class="site-footer container" role="contentinfo">
    <p>&copy; <span id="year"></span> Easy Homes Kenya — Find Your Dream Home in Kenya.</p>
  </footer>

  <script>
    // Update copyright year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Small client-side renderer for listings.json
    // Displays property cards with accessible markup and responsive images (srcset) and lazy loading
    async function loadListings() {
      try {
        const res = await fetch('listings.json', {cache: "no-cache"});
        if (!res.ok) throw new Error('Failed to load listings');
        const data = await res.json();
        const container = document.getElementById('listings');
        if (!data || !Array.isArray(data)) {
          container.innerHTML = '<p>No listings available at the moment.</p>';
          return;
        }

        container.innerHTML = data.map(listing => {
          // Prepare image srcset values (expected naming pattern in images/)
          const base = listing.image || 'images/listing-placeholder.jpg';
          // If your images are not in multiple sizes, keep a single src and still include loading="lazy"
          const small = base.replace(/(\.[a-zA-Z]+)$/, '-small$1');
          const med   = base.replace(/(\.[a-zA-Z]+)$/, '-med$1');
          const large = base.replace(/(\.[a-zA-Z]+)$/, '-large$1');

          // Escape title/fields (minimal)
          const title = listing.title || listing.type || 'Property';
          const price = listing.price ? (listing.price_label || listing.price) : 'Contact for price';
          const city = listing.city || listing.location || '';

          return `\n            <article class="property-card" aria-labelledby="title-${listing.id}">\n              <a href="property.html?id=${encodeURIComponent(listing.id)}" class="card-link">\n                <div class="media">\n                  <img\n                    src="${small}"\n                    srcset="${small} 400w, ${med} 800w, ${large} 1200w"\n                    sizes="(max-width: 600px) 100vw, 33vw"\n                    alt="${listing.alt || title + (city ? ' — ' + city : '')}"\n                    loading="lazy"\n                    width="400"\n                    height="250"\n                    onerror="this.onerror=null;this.src='images/listing-placeholder.jpg';">\n                </div>\n                <div class="card-body">\n                  <h2 id="title-${listing.id}">${title}</h2>\n                  <p class="muted">${city}</p>\n                  <p class="price">${price}</p>\n                </div>\n              </a>\n            </article>`;
        }).join('');
      } catch (err) {
        document.getElementById('listings').innerHTML = '<p>Unable to load listings at this time.</p>';
        console.error(err);
      }
    }

    loadListings();

    // Optional: basic search filtering (client-side)
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim().toLowerCase();
      if (!q) { loadListings(); return; }
      try {
        const res = await fetch('listings.json', {cache: "no-cache"});
        const data = await res.json();
        const filtered = data.filter(item =>
          (item.title || '').toLowerCase().includes(q) ||
          (item.city || '').toLowerCase().includes(q) ||
          (item.location || '').toLowerCase().includes(q)
        );
        const container = document.getElementById('listings');
        if (filtered.length === 0) {
          container.innerHTML = '<p>No properties match your search.</p>';
          return;
        }
        container.innerHTML = filtered.map(listing => {
          const base = listing.image || 'images/listing-placeholder.jpg';
          const small = base.replace(/(\.[a-zA-Z]+)$/, '-small$1');
          const med   = base.replace(/(\.[a-zA-Z]+)$/, '-med$1');
          const large = base.replace(/(\.[a-zA-Z]+)$/, '-large$1');
          const title = listing.title || listing.type || 'Property';
          const price = listing.price ? (listing.price_label || listing.price) : 'Contact for price';
          const city = listing.city || listing.location || '';
          return `\n            <article class="property-card" aria-labelledby="title-${listing.id}">\n              <a href="property.html?id=${encodeURIComponent(listing.id)}" class="card-link">\n                <div class="media">\n                  <img src="${small}" srcset="${small} 400w, ${med} 800w, ${large} 1200w"\n                       sizes="(max-width: 600px) 100vw, 33vw"\n                       alt="${listing.alt || title + (city ? ' — ' + city : '')}"\n                       loading="lazy"\n                       width="400" height="250"\n                       onerror="this.onerror=null;this.src='images/listing-placeholder.jpg';">\n                </div>\n                <div class="card-body">\n                  <h2 id="title-${listing.id}">${title}</h2>\n                  <p class="muted">${city}</p>\n                  <p class="price">${price}</p>\n                </div>\n              </a>\n            </article>`;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
